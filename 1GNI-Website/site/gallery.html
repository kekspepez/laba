<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Галерея — 1GNI</title>
  <meta name="description" content="Фотографии и визуальные образы музыкального проекта 1GNI.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Фото и визуальные образы</p>
        <h1 class="section-title display-2">Галерея</h1>
        <p class="lead muted col-lg-7">Визуальная сторона проекта 1GNI: портреты, обложки и графические образы.</p>
      </div>
    </section>
    <section class="section-space pt-3">
      <div class="container">
        <div id="galleryCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Слайд 1"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1" aria-label="Слайд 2"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2" aria-label="Слайд 3"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="3" aria-label="Слайд 4"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="4" aria-label="Слайд 5"></button>
          </div>
          <div class="carousel-inner rounded-1">
            <div class="carousel-item active"><img src="images/1gni-portrait.png" class="d-block w-100 gallery-slide" alt="Портрет артиста 1GNI"></div>
            <div class="carousel-item"><img src="images/album-bez-koordinat.jpg" class="d-block w-100 gallery-slide" alt="Обложка проекта Без координат"></div>
            <div class="carousel-item"><img src="images/album-tishe-svyaz.jpg" class="d-block w-100 gallery-slide" alt="Обложка релиза Тише связь"></div>
            <div class="carousel-item"><img src="images/1gni-editorial.jpg" class="d-block w-100 gallery-slide" alt="Редакционный портрет 1GNI"></div>
            <div class="carousel-item"><img src="images/1gni-art-toy.jpg" class="d-block w-100 gallery-slide" alt="Стилизованный 3D-образ артиста 1GNI"></div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Предыдущий</span></button>
          <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Следующий</span></button>
        </div>
        <div class="row g-4 mt-4">
          <div class="col-md-4"><article class="album-card h-100"><img class="album-cover" src="images/visual-monogram.svg" alt="Графический монограммный знак 1GNI"><div class="card-body-custom"><span class="badge text-bg-secondary">Графика</span><h2 class="h5 mt-2">Знак проекта</h2></div></article></div>
          <div class="col-md-4"><article class="album-card h-100"><img class="album-cover" src="images/visual-mountain.svg" alt="Иллюстрация горного пейзажа"><div class="card-body-custom"><span class="badge text-bg-secondary">Арт</span><h2 class="h5 mt-2">Без маршрута</h2></div></article></div>
          <div class="col-md-4"><article class="album-card h-100"><img class="album-cover" src="images/visual-night.svg" alt="Ночной пейзаж со звёздами"><div class="card-body-custom"><span class="badge text-bg-secondary">Арт</span><h2 class="h5 mt-2">После заката</h2></div></article></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
