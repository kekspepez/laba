services:
  site1: &site
    build:
      context: .
      dockerfile: Dockerfile
    image: 1gni-static-site:latest
    restart: unless-stopped
    expose:
      - "80"

  site2:
    <<: *site

  site3:
    <<: *site

  site4:
    <<: *site

  site5:
    <<: *site

  gateway:
    image: nginx:1.27-alpine
    container_name: 1gni-gateway
    restart: unless-stopped
    depends_on:
      - site1
      - site2
      - site3
      - site4
      - site5
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
